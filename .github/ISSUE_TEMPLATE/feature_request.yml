name: Feature request
description: Propose an improvement to TraceCell
title: "[feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the design or behavior you are proposing.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Robotics simulation
        - Distributed event processing
        - Observability
        - AWS infrastructure
        - Frontend
        - Performance
        - Testing
        - Documentation
        - Other
