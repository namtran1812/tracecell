name: Bug report
description: Report incorrect TraceCell behavior
title: "[bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide commands, trace IDs, or steps that reproduce the issue.
      placeholder: |
        npm run build
        npm test
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.x

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Trace correlation
        - Event processing
        - AWS infrastructure
        - API
        - React console
        - Root-cause analysis
        - Benchmarking
        - Other
    validations:
      required: true
