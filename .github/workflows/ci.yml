name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Install infrastructure dependencies
        run: npm ci --prefix infrastructure

      - name: Build core
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build web console
        run: npm run build:web

      - name: Build infrastructure
        run: npm run build:infra
